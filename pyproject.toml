[project]
name = "kraftsync"
version = "0.1.0"
description = "Site chat -> live construction dependency graph"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-telegram-bot>=21",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-multipart>=0.0.33",
]

[project.optional-dependencies]
ingest = ["openpyxl>=3.1", "mpxj", "pypdf>=4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
